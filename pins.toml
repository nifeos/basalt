# What basalt builds: each component, pinned by repository and commit.
#
# One table per component. `repository` is where the source lives and `commit` is the full
# 40-character commit basalt builds; a branch or tag name is refused, because a pin that moves on its
# own is not a pin. The gate workflow builds each component at this commit with that commit's own
# toolchain and runs that commit's own system test. The pin-bump workflow proposes a new commit as a
# pull request.
#
# The file name, the format and the key names are ratified: `pins.toml`, one table per component,
# the keys `repository` and `commit` (calef, 2026-10-28 UTC, in the maintainer's session, relayed
# by the maintainer). They are no longer provisional.

[nife]
repository = "https://github.com/nifeos/nife"
commit = "7825864a5c7c7e91ce1aa4b7e24a6f886d826167"
