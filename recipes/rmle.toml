# rmle, as a basalt package: the Rust multi-line editor, nife's first first-party optional package
# (nife milestone 921, rmle is packaged in basalt). Debian ships each editor as its own package, and
# nife's packages/rmle.package.toml makes rmle `optional`: a customer gets it with
# `jig install rmle`, never in a base image.
#
# What is pinned: nothing is fetched. rmle is the `[[bin]]` `rmle` of nife's `components` package,
# built at the nife commit pins.toml names, in its release profile, for each architecture's
# bare-metal target, as nife's own archive builds it. The source archive's `BUILT-FROM` names that
# commit, which is the whole of its source.
#
# The version is the `components` crate's. Every key, the version scheme and the file's layout are
# provisional.

name = "rmle"
version = "0.1.0"
program = "rmle"
# nife's own license, from the pinned checkout's root.
license = "MIT OR Apache-2.0"
license_files = ["LICENSE-MIT", "LICENSE-APACHE"]

[nife]
package = "components"

# Each package's SHA-256, checked by every build; `helpers/packages.py build <nife> <dir>
# --update-digests` rewrites this table after a reviewed change.
[package_digest]
aarch64 = "sha256:9291112e7615ffa9c048509dfec4aa9b3d5c7f084d17018dd4ac0f24ba15a839"
riscv64 = "sha256:06c9ab5bd4d43eaaa3d895ca65feafe1c1e6c2d425156fb411c357fb6128b7db"
x86_64 = "sha256:ed433a8f0517b9bdb9db4a872a3b3ebd19bb610d9108949face37600b54406a8"
