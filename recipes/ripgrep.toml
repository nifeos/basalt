# ripgrep, as a basalt package: the first program basalt builds and publishes (nife milestone 810,
# `ripgrep` is packaged in basalt and installed with `jig`). Optional, never in a base image: a
# customer gets it with `jig install ripgrep`, and runs it as `rg`.
#
# What is pinned, and how each pin is checked by helpers/packages.py before anything is built:
#
# - The source: the crate as crates.io serves it, refused unless its SHA-256 is `sha256` below. That
#   value is the `cksum` crates.io's index carries for the version (https://index.crates.io/ri/pg/ripgrep).
# - Its one patched dependency: `ignore` at its own version and SHA-256, with the patch for its
#   parallel walker on nife applied. The patch is basalt's file `patches/ripgrep-ignore-walk.patch`
#   (its own header says why it exists), refused unless its SHA-256 is the one below, so an edit to
#   it fails the build until this recipe is reviewed with it.
# - The toolchain, the target specs, the standard library and the manifest note all come from the
#   nife commit pins.toml names, as the gate's build does.
#
# The package digest is recorded per architecture in `[package_digest]`, and every build refuses a
# package that does not hash to it: the build is reproducible across machines (README.md, "Packages
# build reproducibly"), so a reviewer can rebuild and compare.
#
# Every key and the file's layout are provisional.

name = "ripgrep"
version = "14.1.1"
# The upstream source.
crate = "ripgrep"
sha256 = "f77b8032dc584527975f34aa5a897d0ef5a785573fda778771a614ff9da501d9"
# The program, as the package carries it: the member `bin/rg`, so `jig install ripgrep` installs the
# program `rg` (nife's `package_archive::PROGRAM_PREFIX`).
program = "rg"
# What upstream licenses it under (SPDX), and the files inside the crate the package carries as
# `doc/<file name>`. The package also carries `doc/THIRD-PARTY-NOTICES`, the license files of the
# crates ripgrep is built from, which helpers/packages.py writes from the locked dependency graph.
license = "Unlicense OR MIT"
license_files = ["COPYING", "LICENSE-MIT", "UNLICENSE"]

[[patch]]
crate = "ignore"
version = "0.4.23"
sha256 = "6d89fd380afde86567dfba715db065673989d6253f42b88179abd3eae47bda4b"
# A path in this repository, and the SHA-256 of the file there.
file = "patches/ripgrep-ignore-walk.patch"
file_sha256 = "dd6a89d54616551f737f9d4594089726a778404843e4ee0ccaad5a6368ccf941"

# Each package's SHA-256, checked by every build; `helpers/packages.py build <nife> <dir>
# --update-digests` rewrites this table after a reviewed change.
[package_digest]
aarch64 = "sha256:85d9c1805fa22811ad0eed2d365c94e136721b86115480d607ec3716ef393b8b"
riscv64 = "sha256:0c3d123ca5510073c7156df475de6788ec6333ce7f471f419c0befc7129b9bda"
x86_64 = "sha256:44bfaf15e0bbb2c3f549ec03d1b5b256016f3936d964f02c06af544c7989045e"
