# demos, as a basalt package: nife's demonstration programs, the second first-party optional package
# (nife milestone 922, the demos are packaged in basalt). Debian ships examples as their own
# packages, and nife's packages/demos.package.toml makes this one `optional`: a customer gets it
# with `jig install demos`, never in a base image.
#
# Today it carries one program, `least_authority_demo`, the `[[bin]]` of nife's `components`
# package that squares the integer its line names. Its manifest note declares that argument, so
# the installed program is granted it once the package is vouched.
#
# What is pinned: nothing is fetched. The program is built at the nife commit pins.toml names, in
# its release profile, for each architecture's bare-metal target, as rmle is. The source archive's
# `BUILT-FROM` names that commit, which is the whole of its source.
#
# The version is the `components` crate's. Every key, the version scheme and the file's layout are
# provisional.

name = "demos"
version = "0.1.0"
program = "least_authority_demo"
# nife's own license, from the pinned checkout's root.
license = "MIT OR Apache-2.0"
license_files = ["LICENSE-MIT", "LICENSE-APACHE"]

[nife]
package = "components"

# Each package's SHA-256, checked by every build; `helpers/packages.py build <nife> <dir>
# --update-digests` rewrites this table after a reviewed change.
[package_digest]
aarch64 = "sha256:01c9c11de7fe42973f9cd8f117d5e5ff4556acdddf79e6afa48cad76e6d57087"
riscv64 = "sha256:ab81b8a77cbce27f33f7ce6b78ea5c49228777a6618de5235e52c17e8467bab5"
x86_64 = "sha256:06bbafefdd24fa8ccdf1b0a4340c7ce62e642b004536e9b7ba3c044fe4f6da43"
