# ruff, for helpers/*.py: the `lint` job in .github/workflows/gate.yml runs `ruff check`.
# The rules are ruff's defaults (pyflakes and the pycodestyle errors) plus import order. Lines run
# to 100 columns, as the rest of the tree's prose and code does. Name and rule set provisional.
line-length = 100
target-version = "py312"

[lint]
extend-select = ["I"]
