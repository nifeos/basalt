# publish: put a green `packages` run on main where it is served. The packages and their source
# archives go on a GitHub Release, and the index on GitHub Pages, the project site of this
# repository at its own custom domain, `basalt.nifeos.org` (calef, 2026-10-12 UTC: "Packages on
# Releases, index on Pages"). Each index line lists the package's Release asset, whose download
# count is the first adoption signal (nife milestone 576). `backup` then copies the same files to
# the index's second address, `basalt.crickertech.com`, the Pages site of nifeos/basalt-backup
# (nife §250 clause 6).
#
# **Why a workflow of its own.** `packages`' `build` runs a release's code with sudo, and on main
# that code may be a recipe bump no person read (record §328). It can read that run's artifact
# token and keep it past the job, so anything that run uploads, or that a later job of the same run
# downloads, may have been replaced. This workflow is a separate run: its own artifacts (the Pages
# site that `backup` copies) are out of that token's reach. What it takes from the packages run, the
# `repository` artifact, is believed for nothing main records: `helpers/packages.py publish` keeps
# only the packages main's recipes name, each hashing to its `[package_digest]` line, writes the
# index from those recipes and rebuilds each source archive from main. No job here runs upstream
# code, checks out anything but main, or keeps a checkout credential.
#
# It starts only on a `packages` run that succeeded, for a push to main or a dispatch on main, in
# this repository, and only when main is still the commit that run built: a later push has its own
# run, which publishes it. Every job of that run must have passed, `composed` and the `rg-threads`
# legs as well as `reproduce` and `install`.
#
# Names provisional: the file, the workflow, the jobs, the Release tag scheme, the job output.
name: publish

on:
  workflow_run:
    workflows: [packages]
    types: [completed]

permissions: {}

# No workflow-level concurrency: every completed `packages` run starts this workflow, a pull
# request's and a merge queue's as well, and a run in a group cancels the group's older pending run
# even when its own job is then skipped. So a no-op run could silently cancel the pending publish of
# a main commit. The group is on the `publish` job, which enters it only when its `if:` holds.

jobs:
  publish:
    name: publish the index to Pages and the packages to a Release
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main'
      && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
      && github.event.workflow_run.repository.full_name == github.repository
      && github.event.workflow_run.head_repository.full_name == github.repository
    # One publish at a time, never cancelled once it runs.
    concurrency:
      group: publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read    # the packages run's artifact
      contents: write  # the Release and its tag
      pages: write     # the deployment
      id-token: write  # which deploy-pages needs to prove the deployment came from this run
    environment:
      name: github-pages
      url: https://basalt.nifeos.org/rolling/metadata/stand-in-index
    outputs:
      site: ${{ steps.site.outputs.digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      DOMAIN: basalt.nifeos.org
      BUILT: ${{ github.event.workflow_run.head_sha }}
      BUILT_RUN: ${{ github.event.workflow_run.id }}
    steps:
      # main, never a ref the packages run names: a workflow_run job checks out the default branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: main must be the commit the packages run built
        run: |
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$BUILT" ]; then
            echo "::error::main is $head, but packages run $BUILT_RUN built $BUILT; that commit's own run publishes main"
            exit 1
          fi

      # Before anything is created: the index must land at the name every image carries. Without a
      # custom domain a project site is served under the organization's Pages host, and once the
      # organization's own site (nifeos/nifeos.github.io) takes www.nifeos.org that would put this
      # index at www.nifeos.org/basalt, a name no image carries.
      - name: Pages must be on, from Actions, at basalt.nifeos.org
        run: |
          if ! site="$(gh api "repos/$GITHUB_REPOSITORY/pages" 2>/dev/null)"; then
            echo "::error::GitHub Pages is not enabled for $GITHUB_REPOSITORY; see the README's \"What calef must do\""
            exit 1
          fi
          echo "$site" | jq '{build_type, cname, https_enforced, html_url}'
          [ "$(echo "$site" | jq -r .build_type)" = workflow ] || { echo "::error::Pages must deploy from GitHub Actions"; exit 1; }
          [ "$(echo "$site" | jq -r .cname)" = "$DOMAIN" ] || { echo "::error::Pages' custom domain must be $DOMAIN"; exit 1; }
          [ "$(echo "$site" | jq -r .https_enforced)" = true ] || echo "::warning::HTTPS is not enforced on $DOMAIN yet"

      - name: Fetch the repository the packages run built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repository
          path: repository
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # One Release per publish, named for the channel, the commit's UTC date and the commit, so a
      # rerun of the same commit names the same Release. Provisional.
      - name: Name the Release
        id: tag
        run: |
          day="$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%d)"
          tag="rolling-$day-${BUILT::7}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=https://github.com/$GITHUB_REPOSITORY/releases/download/$tag" >> "$GITHUB_OUTPUT"

      # The artifact is believed for nothing main records (the header says why). Base packages are
      # never published, so a base file in it is refused.
      - name: Write the site
        run: helpers/packages.py publish repository site --release "${{ steps.tag.outputs.release }}"

      # The front page: web/index.html with lists of the files `publish` just wrote, so a link
      # never names a file the site lacks. The `backup` job writes its own wording of the same page.
      - name: Write the front page
        run: helpers/index_page.py web/index.html site primary

      # Every file of the tree that is deployed, by path and SHA-256. `backup` refuses a site that
      # is not this one.
      - name: Take the site's digest
        id: site
        run: echo "digest=$(helpers/packages.py site-digest site)" | tee -a "$GITHUB_OUTPUT"

      # A rerun of failed jobs reuses the same artifact, so the bytes are the same and the Release
      # that exists is accepted. Different bytes under an existing tag are refused: an asset is
      # never replaced, since an index somewhere may already vouch for it. A source archive the
      # Release lacks is added to it. What goes up is what `publish` wrote, never the artifact.
      #
      # Each package goes up with its source archive (`<name>-<version>-source.tar.gz`, provisional),
      # what helpers/packages.py says it was built from: a GPL package's binary may only be offered
      # with its source, and every package is treated the same.
      - name: Put the packages and their sources on the Release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PACKAGES_RUN: ${{ github.event.workflow_run.html_url }}
        run: |
          shopt -s nullglob
          sources=(site/rolling/sources/*-source.tar.gz)
          [ ${#sources[@]} -gt 0 ] || { echo "::error::the build wrote no source archives"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir existing
            gh release download "$TAG" --dir existing --pattern '*.nifepkg' --pattern '*-source.tar.gz'
            for f in site/rolling/targets/*.nifepkg "${sources[@]}"; do
              e="existing/$(basename "$f")"
              if [ ! -e "$e" ] && [[ "$f" == *-source.tar.gz ]]; then
                gh release upload "$TAG" "$f"
                continue
              fi
              cmp -s "$f" "$e" || { echo "::error::$TAG holds a different $(basename "$f")"; exit 1; }
            done
            echo "$TAG holds these packages and their sources"
          else
            {
              echo "basalt's rolling channel, built at nife's pin by run $PACKAGES_RUN and published by run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
              echo
              echo "The index at https://$DOMAIN/rolling/metadata/stand-in-index lists these assets and their SHA-256 digests:"
              echo
              echo '```'
              cat site/rolling/metadata/stand-in-index
              echo '```'
              echo
              echo "Each package's source, the exact files and patches it was built from, is the \`<name>-<version>-source.tar.gz\` beside it."
            } > notes.md
            gh release create "$TAG" site/rolling/targets/*.nifepkg "${sources[@]}" \
              --target "$BUILT" --title "$TAG" --notes-file notes.md
          fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      # deploy-pages lists the run's artifacts through the Actions artifact service and fails with
      # `No artifacts named "github-pages" were found` when that listing, read well under a second
      # after upload-pages-artifact finalized the upload, does not show it yet (the artifact is there
      # a moment later). So the deployment is tried up to three times, with a pause before each
      # retry; only the last attempt may fail the job. A failed attempt created no deployment, so a
      # retry is safe.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Wait before the second deployment attempt
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment-second
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Wait before the last deployment attempt
        if: steps.deployment.outcome == 'failure' && steps.deployment-second.outcome == 'failure'
        run: sleep 90
      - id: deployment-last
        if: steps.deployment.outcome == 'failure' && steps.deployment-second.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # The index's second address, basalt.crickertech.com (nife §250 clause 6; calef, 2026-10-21 UTC:
  # "P1: a second Pages site in nifeos for basalt.crickertech.com"). Pages serves one custom domain
  # per site, so it is the site of its own repository, nifeos/basalt-backup, which serves its
  # `pages` branch. This job replaces that branch with the very files `publish` deployed, once they
  # hash to the digest `publish` took, plus the two a branch-built site needs: CNAME (its custom
  # domain) and .nojekyll (serve files as they are). A separate job so that a failure here never
  # holds back basalt.nifeos.org; it fails loudly rather than skipping when its deploy key is
  # missing.
  #
  # Names provisional: the job, the repository, the branch and the secret.
  backup:
    name: copy the site to the second address
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: backup-site
      cancel-in-progress: false
    env:
      DOMAIN: basalt.crickertech.com
      SITE_REPOSITORY: nifeos/basalt-backup
      BRANCH: pages
      SITE_DIGEST: ${{ needs.publish.outputs.site }}
      BUILT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch what publish deployed
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: deployed

      - name: The site must be the one publish wrote
        run: |
          [ -n "$SITE_DIGEST" ] || { echo "::error::publish gave no site digest"; exit 1; }
          mkdir site
          tar -xf deployed/artifact.tar -C site
          got="$(helpers/packages.py site-digest site)"
          [ "$got" = "$SITE_DIGEST" ] || { echo "::error::the deployed site hashes to $got, not publish's $SITE_DIGEST"; exit 1; }

      - name: Replace the second site's branch with it
        env:
          DEPLOY_KEY: ${{ secrets.BACKUP_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::BACKUP_DEPLOY_KEY is not set, so $DOMAIN is not updated; see the README's \"What calef must do\""
            exit 1
          fi
          [ -s site/rolling/metadata/stand-in-index ] || { echo "::error::the deployed site has no index"; exit 1; }
          [ -s site/index.html ] || { echo "::error::the deployed site has no front page"; exit 1; }
          # The same page, worded for the backup.
          helpers/index_page.py web/index.html site backup
          echo "$DOMAIN" > site/CNAME
          touch site/.nojekyll
          install -m 700 -d ~/.ssh
          (umask 077; printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/backup_site)
          # github.com's host keys, from its own API over TLS rather than trusted on first use.
          curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/backup_site -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          # One orphan commit each time, so the repository holds one copy of the packages, not
          # every publish's.
          cd site
          git init -q -b "$BRANCH"
          git add -A
          git -c user.name="basalt publish" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "basalt's site as published by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID ($BUILT)"
          git push --force "git@github.com:$SITE_REPOSITORY.git" "$BRANCH:$BRANCH"
          echo "$SITE_REPOSITORY's $BRANCH holds $(git ls-files | wc -l) files, served at https://$DOMAIN/"
