# pin bump: propose moving each pin in pins.toml to its component's newest main commit.
#
# A proposal, not a push. The bump lands as a pull request on the branch `pin/nife`, force-pushed on
# each run so there is only ever one open, and the gate runs on it like on any other pull request.
# The pull request arms auto-merge on itself (below), so it merges once the required checks pass.
# That keeps every pin change reviewable and revertible as one commit, and it means a nife commit
# that breaks basalt's gate is a red pull request rather than a red main.
#
# **Auto-merge, and why the gate is enough.** calef approved this on 2026-10-21 (UTC) to save a
# daily click. The required checks are the review: nife's own system test at the new pin on
# aarch64, riscv64 and x86_64, the `packages` builds that must come out byte-identical twice, the
# `lint` job, the jig installs, and the two composed image boots. A merge to main publishes the
# index to Pages and the packages to a Release, so the run arms only a pull request it can vouch
# for, and only when all of these hold:
#   - the run is on main, and the pull request is `pin/nife` in this repository, opened by the
#     automation App (`nife-smelter[bot]`), with the head this run pushed (`--match-head-commit`);
#   - the diff touches only pins.toml and the `[package_digest]` lines of existing recipes
#     (`helpers/pins.py only-bump`).
# Otherwise it disarms the pull request and says why in its body and the run's summary. The App
# token matters twice: it is what lets the pull request run the gate by itself, and a merge armed by
# the App is pushed by the App, which starts `packages`; one armed with `github.token` would not.
# The branch is force-pushed, so every run arms again. There is no hold label: holding a nife change
# back is rare and there are no customers yet. To hold one, `gh pr merge pin/nife --disable-auto`;
# that lasts until the next run (daily at 06:17 UTC) arms the new head, so to hold longer also
# `gh workflow disable pin-bump.yml`. Dependabot's pull requests are not touched here.
#
# **Which identity, and why it matters.** GitHub does not start workflows for a push or a pull
# request made with the job's own `github.token`. So when the run has only that token, it starts the
# gate itself with `gh workflow run`, which is the one event that token is allowed to trigger, and
# the gate's checks land on the bump commit and show on the pull request. When the repository has
# the automation App's secrets (`AUTOMATION_APP_ID`, `AUTOMATION_APP_KEY`) the run uses an
# installation token instead and the pull request triggers the gate on its own.
#
# **Opening the pull request needs a repository setting.** With `github.token`, `gh pr create` is
# refused unless Settings > Actions > General > "Allow GitHub Actions to create and approve pull
# requests" is on. The branch is pushed and the gate started before that step, so the evidence
# exists either way; the run then fails and says which setting it needed.
#
# **The bump carries the new digests.** A moved pin moves the packages, and a recipe records each
# package's SHA-256 (nife milestone 917), so after rewriting the pin the job builds the packages at
# the new commit with `helpers/packages.py build --update-digests` and commits the changed
# `[package_digest]` lines in the same pull request (calef, 2026-10-17 UTC, asked whether the bot
# should regenerate digests in its own pull request: "Yes"). The `packages` workflow then builds
# the bump twice and its `reproduce` job fails unless the two builds are byte-identical, so a digest
# the bot wrote is checked by an independent build, and a reviewer reads the digest lines in the
# diff. The job runs on the arm64 pool, where `packages` builds.
#
# On a pull request that touches this file or helpers/pins.py, the job runs as a dry run: it reads
# nife's main, rewrites the pin and the digests in its own checkout and prints the diff, and pushes
# nothing. That is this workflow's own test, though it proves only that the build runs and rewrites
# the tables: that the digests reproduce is proven by `packages` on the first real bump. The dry run
# also commits the bump locally and checks that `only-bump` accepts it and refuses each fake diff it
# must refuse. The identity checks need a real pull request, and are proven by the first real run.
#
# Names provisional: the file, the workflow, the job and the branch `pin/nife`.
name: pin bump

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      commit:
        description: "nife commit to propose instead of main's head (full 40-character id)"
        required: false
        default: ""
  pull_request:
    paths:
      - .github/workflows/pin-bump.yml
      - helpers/pins.py

concurrency:
  group: pin-bump-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  propose:
    name: propose a nife pin bump
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
      DRY_RUN: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Mint an installation token for the automation App
        id: app-token
        if: env.AUTOMATION_APP_ID != '' && env.DRY_RUN != 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Work out whether there is anything to propose
        id: plan
        env:
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          set -e
          eval "$(helpers/pins.py get nife | sed 's/^/pin_/')"
          if [ -n "$INPUT_COMMIT" ]; then
            target="$INPUT_COMMIT"
          else
            target="$(git ls-remote "$pin_repository" refs/heads/main | cut -f1)"
          fi
          [ -n "$target" ] || { echo "could not read main's head from $pin_repository" >&2; exit 1; }
          {
            echo "current=$pin_commit"
            echo "target=$target"
            echo "repository=$pin_repository"
            echo "slug=$pin_slug"
          } >> "$GITHUB_OUTPUT"
          if [ "$pin_commit" = "$target" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "nife is already pinned at $target; nothing to propose."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Proposing nife $pin_commit -> $target"
          fi

      - name: Rewrite the pin
        if: steps.plan.outputs.skip == 'false'
        env:
          TARGET: ${{ steps.plan.outputs.target }}
        run: |
          helpers/pins.py set nife "$TARGET"
          helpers/pins.py get nife

      - name: Check out nife at the new pin
        if: steps.plan.outputs.skip == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.plan.outputs.slug }}
          ref: ${{ steps.plan.outputs.target }}
          path: nife
          persist-credentials: false

      - name: Provision the toolchain the new pin names
        if: steps.plan.outputs.skip == 'false'
        working-directory: nife
        run: script/bootstrap
        env:
          NIFE_SKIP_LINT_TOOLS: "1"

      - name: Install clang 19 for the C recipes
        if: steps.plan.outputs.skip == 'false'
        run: sudo apt-get update && sudo apt-get install -y clang-19

      # The same command `packages` runs, plus the flag that records what it built. It must run
      # from a clean tree apart from pins.toml, since the rewritten recipes are what gets committed.
      - name: Record the new packages' digests
        if: steps.plan.outputs.skip == 'false'
        run: |
          helpers/packages.py build nife repository --update-digests
          git diff --stat
          git diff
        env:
          NIFE_CC: clang-19

      # The dry run's test of `only-bump`: the real bump (empty when there is none) must pass, and
      # each fake diff below must be refused. Nothing here is pushed.
      - name: Check the auto-merge guard against the bump and fake diffs
        if: env.DRY_RUN == 'true'
        run: |
          set -e
          commit() { git -c user.name=dry-run -c user.email=dry-run@invalid commit -q --allow-empty -m "$1"; }
          git add pins.toml recipes
          commit "dry-run bump"
          helpers/pins.py only-bump HEAD^ HEAD
          echo "accepted: the bump"
          refuse() {
            git add -A README.md recipes
            commit "$1"
            if helpers/pins.py only-bump HEAD^ HEAD; then
              echo "::error::only-bump accepted a diff it must refuse: $1"
              exit 1
            fi
            echo "refused, as it must be: $1"
            git reset -q --hard HEAD^
          }
          echo dry-run >> README.md
          refuse "a file other than pins.toml or a recipe"
          sed -i '1i # dry-run' recipes/ripgrep.toml
          refuse "a recipe line outside [package_digest]"
          sed -i '/^\[package_digest\]$/a extra = "dry-run"' recipes/ripgrep.toml
          refuse "a line in [package_digest] that is not a digest"
          cp recipes/ripgrep.toml recipes/dry-run.toml
          refuse "a new recipe"

      - name: Push the branch, start the gate, open or update the pull request
        id: push
        if: steps.plan.outputs.skip == 'false' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          CURRENT: ${{ steps.plan.outputs.current }}
          TARGET: ${{ steps.plan.outputs.target }}
          REPOSITORY: ${{ steps.plan.outputs.repository }}
        run: |
          set -e
          branch="pin/nife"
          short_current="$(printf %.9s "$CURRENT")"
          short_target="$(printf %.9s "$TARGET")"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add pins.toml recipes
          git commit -m "pin nife at $short_target

          Moves the nife pin from $CURRENT
          to $TARGET, proposed by the scheduled pin bump, and records
          the digests of the packages built there (helpers/packages.py
          build --update-digests).
          What changed in nife: $REPOSITORY/compare/$CURRENT...$TARGET"
          git push --force origin "$branch"

          if [ -z "$APP_TOKEN" ]; then
            gh workflow run gate.yml --ref "$branch"
            gh workflow run packages.yml --ref "$branch"
            echo "Started the gate and packages on $branch (a github.token push starts no workflow by itself)."
          fi

          title="pin nife at $short_target"
          body="**Lane:** $branch, opened by the scheduled pin-bump workflow.

          Moves nife from \`$short_current\` to \`$short_target\`: [what changed]($REPOSITORY/compare/$CURRENT...$TARGET).

          The \`[package_digest]\` lines in \`recipes/\` are the SHA-256 of each package built at the new
          pin, written by \`helpers/packages.py build --update-digests\` (calef, 2026-10-17 UTC). Read them
          in the diff: an unchanged line means that package did not move. \`packages\` rebuilds twice on
          independent paths and its \`reproduce\` job fails unless the two are byte-identical.

          The gate check on this pull request is nife's own image build and system test, run at the new
          pin on aarch64, riscv64 and x86_64. Green means the pin is safe to take. Red means nife's main
          moved to a commit that fails its own system test here; do not merge, and look at the gate's log.

          This branch is force-pushed on every scheduled run, so it always proposes main's newest head."
          printf '%s\n' "$body" > "$RUNNER_TEMP/body.md"

          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[].number')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
            echo "Updated pull request #$existing in place."
          elif ! gh pr create --head "$branch" --base main --title "$title" --body "$body"; then
            echo "::error::Could not open the pull request. With github.token this needs Settings >" \
                 "Actions > General > 'Allow GitHub Actions to create and approve pull requests'." \
                 "The branch $branch is pushed and the gate is running on it."
            exit 1
          fi
          {
            echo "pr=$(gh pr list --head "$branch" --state open --json number --jq '.[].number')"
            echo "head=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # The conditions and the reason are in the header. A refusal is not a failed run: the pull
      # request stays open for a person, and its body says why.
      - name: Arm auto-merge, or say why not
        if: steps.plan.outputs.skip == 'false' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR: ${{ steps.push.outputs.pr }}
          PUSHED: ${{ steps.push.outputs.head }}
        run: |
          set -e
          refusals=()
          [ "$GITHUB_REF" = refs/heads/main ] || refusals+=("this run is on $GITHUB_REF, not main")
          IFS=$'\t' read -r login ref repo head < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" \
            --jq '[.user.login, .head.ref, .head.repo.full_name, .head.sha] | @tsv')
          [ "$login" = "nife-smelter[bot]" ] || refusals+=("it was opened by $login, not nife-smelter[bot]")
          [ "$ref" = pin/nife ] && [ "$repo" = "$GITHUB_REPOSITORY" ] \
            || refusals+=("its head is $repo:$ref, not $GITHUB_REPOSITORY:pin/nife")
          [ "$head" = "$PUSHED" ] || refusals+=("its head is $head, not $PUSHED, which this run pushed")
          if ! diff="$(helpers/pins.py only-bump HEAD^ HEAD)"; then
            while IFS= read -r line; do refusals+=("$line"); done <<< "$diff"
          fi

          if [ ${#refusals[@]} -eq 0 ]; then
            gh pr merge "$PR" --auto --merge --match-head-commit "$PUSHED"
            note="**Auto-merge is armed** for \`$(printf %.9s "$PUSHED")\`: this pull request merges once the
          required checks pass, and the merge publishes to Pages and a Release. To hold it, run
          \`gh pr merge pin/nife --disable-auto\`; the next scheduled run arms its new head again."
            echo "Armed auto-merge on #$PR at $PUSHED." >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr merge "$PR" --disable-auto 2>/dev/null || true
            reasons="$(printf -- '- %s\n' "${refusals[@]}")"
            note="**Auto-merge is not armed.** This pull request needs a person, because:
          $reasons"
            printf 'Did not arm auto-merge on #%s:\n%s\n' "$PR" "$reasons" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Did not arm auto-merge on #$PR; see the summary."
          fi
          gh pr edit "$PR" --body "$(cat "$RUNNER_TEMP/body.md")

          $note"
