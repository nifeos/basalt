# codeql: CodeQL on basalt's own code, the workflows (`actions`) and helpers/*.py (`python`).
#
# The shape is nife's advanced setup without its prose-only gate: both languages are interpreted,
# so `build-mode: none` and no build. Not a required check; a pull request is scanned by its own
# run and the merge lands into a `push` run on `main`. Advanced setup's uploads are refused while
# default setup is on, so default setup stays off for this repository.
#
# Names provisional: the file, the workflow and the job.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write  # the SARIF upload
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}
