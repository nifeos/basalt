# record pin bump: propose moving the `[record]` pin in pins.toml to the record's newest main commit.
#
# The design record, `nifeos/record`, has no build. Its pin says which commit of the record goes with
# this distribution, and nife reads the record at that commit once the record has left nife (nife
# milestone 1018, step 6; nife's `helpers/record_root.py`). The record's main requires its own
# `record lint` check through a ruleset and a merge queue, so every commit on it has passed that
# check already; this workflow does not check the record again.
#
# **When it runs.** The record's `basalt-record-pin` workflow sends a `repository_dispatch` of type
# `record-merged` here on every push to the record's main, which is every merge. The daily schedule
# catches a dispatch that did not arrive, and `workflow_dispatch` proposes a chosen commit by hand.
# Whatever sent it, the run proposes main's head as it reads it, not a commit named in the
# dispatch, so two merges close together give one proposal of the later one. The run before a
# superseding one is cancelled.
#
# **A proposal, not a push.** Like the nife pin bump (`pin-bump.yml`), the bump lands as a pull
# request on one branch, `pin/record`, force-pushed on each run so there is only ever one open, and
# the required checks run on it. Unlike that one, this run does not arm auto-merge: a person or an
# agent merges it. The gate and `packages` check nothing about the record, so their green says
# only that the rest of basalt is unchanged, and a merge to main still publishes a Release.
#
# **Which identity.** The same as the nife pin bump, for the same reasons: with the automation App's
# secrets (`AUTOMATION_APP_ID`, `AUTOMATION_APP_KEY`) the run uses an installation token and the pull
# request triggers the required checks on its own; with only `github.token` it starts `gate` and
# `packages` itself with `gh workflow run`, and opening the pull request then needs Settings >
# Actions > General > "Allow GitHub Actions to create and approve pull requests".
#
# On a pull request that touches this file or helpers/pins.py, the job runs as a dry run: it reads
# the record's main, rewrites the pin in its own checkout, checks that only the `[record]` commit
# line changed, prints the diff, and pushes nothing.
#
# Names provisional: the file, the workflow, the job, the branch `pin/record` and the dispatch type
# `record-merged`.
name: record pin bump

on:
  repository_dispatch:
    types: [record-merged]
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:
    inputs:
      commit:
        description: "record commit to propose instead of main's head (full 40-character id)"
        required: false
        default: ""
  pull_request:
    paths:
      - .github/workflows/record-pin-bump.yml
      - helpers/pins.py

concurrency:
  group: record-pin-bump-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  propose:
    name: propose a record pin bump
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
      DRY_RUN: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Mint an installation token for the automation App
        id: app-token
        if: env.AUTOMATION_APP_ID != '' && env.DRY_RUN != 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Work out whether there is anything to propose
        id: plan
        env:
          INPUT_COMMIT: ${{ inputs.commit }}
          SENT: ${{ github.event.client_payload.commit }}
        run: |
          set -e
          eval "$(helpers/pins.py get record | sed 's/^/pin_/')"
          if [ -n "$INPUT_COMMIT" ]; then
            target="$INPUT_COMMIT"
          else
            target="$(git ls-remote "$pin_repository" refs/heads/main | cut -f1)"
          fi
          [ -n "$target" ] || { echo "could not read main's head from $pin_repository" >&2; exit 1; }
          [ -z "$SENT" ] || echo "The dispatch named $SENT; proposing main's head, $target."
          {
            echo "current=$pin_commit"
            echo "target=$target"
            echo "repository=$pin_repository"
          } >> "$GITHUB_OUTPUT"
          if [ "$pin_commit" = "$target" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "The record is already pinned at $target; nothing to propose."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Proposing record $pin_commit -> $target"
          fi

      # A record pin bump changes the `[record]` commit line and nothing else: no recipe, and no
      # other table. The check compares the parsed manifest before and after, so it holds on a dry
      # run with nothing to propose too.
      - name: Rewrite the pin and check that nothing else moved
        env:
          SKIP: ${{ steps.plan.outputs.skip }}
          TARGET: ${{ steps.plan.outputs.target }}
        run: |
          set -e
          cp pins.toml "$RUNNER_TEMP/pins.before.toml"
          [ "$SKIP" = true ] || helpers/pins.py set record "$TARGET"
          helpers/pins.py get record
          python3 - "$RUNNER_TEMP/pins.before.toml" pins.toml "$TARGET" <<'EOF'
          import sys, tomllib
          before, after = (tomllib.load(open(path, "rb")) for path in sys.argv[1:3])
          before["record"]["commit"] = sys.argv[3]
          if before != after:
              sys.exit("record pin bump: pins.toml changed outside the [record] commit")
          EOF
          changed="$(git diff --name-only)"
          [ -z "$changed" ] || [ "$changed" = pins.toml ] \
            || { echo "record pin bump: files other than pins.toml changed: $changed" >&2; exit 1; }
          git diff

      - name: Push the branch, start the checks, open or update the pull request
        if: steps.plan.outputs.skip == 'false' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          CURRENT: ${{ steps.plan.outputs.current }}
          TARGET: ${{ steps.plan.outputs.target }}
          REPOSITORY: ${{ steps.plan.outputs.repository }}
        run: |
          set -e
          branch="pin/record"
          short_current="$(printf %.9s "$CURRENT")"
          short_target="$(printf %.9s "$TARGET")"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add pins.toml
          git commit -m "pin record at $short_target

          Moves the record pin from $CURRENT
          to $TARGET, proposed by the record pin bump after a merge
          to the record's main.
          What changed in the record: $REPOSITORY/compare/$CURRENT...$TARGET"
          git push --force origin "$branch"

          if [ -z "$APP_TOKEN" ]; then
            gh workflow run gate.yml --ref "$branch"
            gh workflow run packages.yml --ref "$branch"
            echo "Started gate and packages on $branch (a github.token push starts no workflow by itself)."
          fi

          title="pin record at $short_target"
          body="**Lane:** $branch, opened by the record pin-bump workflow.

          Moves the design record (\`nifeos/record\`) from \`$short_current\` to \`$short_target\`:
          [what changed]($REPOSITORY/compare/$CURRENT...$TARGET). Every commit on the record's main
          passed its \`record lint\` check on the way in, through the record's merge queue.

          The record has no build, so the gate and \`packages\` check nothing about it here: their green
          says the rest of basalt is unchanged. The diff is the one \`commit\` line of \`[record]\` in
          \`pins.toml\`, and the workflow refuses any other change before it pushes.

          This branch is force-pushed on every run, so it always proposes the record's newest main.
          Auto-merge is not armed; merge it by hand."
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[].number')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
            echo "Updated pull request #$existing in place."
          elif ! gh pr create --head "$branch" --base main --title "$title" --body "$body"; then
            echo "::error::Could not open the pull request. With github.token this needs Settings >" \
                 "Actions > General > 'Allow GitHub Actions to create and approve pull requests'." \
                 "The branch $branch is pushed and the checks are running on it."
            exit 1
          fi
