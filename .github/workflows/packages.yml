# packages: build basalt's packages against the pinned nife, lay them out as a repository, and prove
# a booted nife installs them with `jig` (nife milestone 810, `ripgrep` is packaged in basalt and
# installed with `jig`).
#
# Six jobs. `build` runs helpers/packages.py on the pinned nife commit: each recipe's source is
# fetched and refused unless its SHA-256 is the recipe's, built for the three nife targets with that
# commit's toolchain, standard library and manifest note, and packed with that commit's own
# `cargo xtask package`. The repository it writes (`rolling/metadata/stand-in-index` and
# `rolling/targets/`) is kept as the run's artifact. `install` boots the pinned nife's interactive
# check, `script/ci-build`'s swish-check rows, with that repository named in
# `NIFE_BASALT_REPOSITORY`: the test index host then serves basalt's packages beside nife's
# fixtures, and the check types `jig update`, `jig install ripgrep` and `rg --version` at the
# prompt on each architecture. The legs run where nife's own CI runs them: aarch64 and riscv64 on
# the arm64 pool, x86_64 on an x86_64 runner under KVM.
#
# `composed` is the other half of nife milestone 909 (basalt composes the bootable image from its
# packages): it builds the base packages at the pin with `helpers/packages.py base`, so basalt's own
# packages are what enter the image, and then composes each architecture's kernel and initial
# ramdisk from them with the pin's `cargo xtask base-image` and boots it. No binary in the image's
# ramdisk came from nife's tree build. It is not one of the four names the ruleset requires (see
# CONTRIBUTING.md); adding it there is calef's act.
#
# A third job, `publish`, runs on `main` only, after both: it puts the packages and their source
# archives on a GitHub Release and the index on GitHub Pages, the project site of this repository at
# its own custom domain, `basalt.nifeos.org` (calef, 2026-10-12 UTC: "Packages on Releases, index on
# Pages"). Each index line lists the package's Release asset, whose download count is the first
# adoption signal (nife milestone 576). It refuses to run until Pages is enabled with that domain,
# which is calef's act (the README's "What calef must do"). After it, `backup` copies the same
# files to the index's second address, `basalt.crickertech.com`, the Pages site of
# nifeos/basalt-backup (nife §250 clause 6).
#
# Names provisional: the file, the workflow, the jobs, the artifact and the Release tag scheme.
name: packages

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Two builds, on two runners, with two checkout paths, temporary directories, cargo homes and rustup homes: `primary` is
  # the repository the next jobs install and publish, `independent` exists to be compared with it
  # (nife milestone 917, basalt's packages build reproducibly). Each also refuses any package whose
  # SHA-256 is not the one its recipe records, so a build that is not reproducible fails here
  # before `reproduce` looks.
  build:
    # The primary leg keeps the name the repository's ruleset requires.
    name: ${{ matrix.job }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    # The toolchain and registry directories differ between the legs too: a program built from them
    # names them in its panic locations unless the build rewrites them.
    env:
      CARGO_HOME: ${{ matrix.cargo_home }}
      RUSTUP_HOME: ${{ matrix.rustup_home }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: primary
            job: "build the packages at nife's pin"
            nife_path: nife
            tmp: tmp-primary
            cargo_home: /home/runner/.cargo
            rustup_home: /home/runner/.rustup
          - leg: independent
            job: "rebuild the packages independently"
            nife_path: independent/checkout/of/nife
            tmp: tmp-independent
            cargo_home: /home/runner/other-cargo
            rustup_home: /home/runner/other-rustup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read the pin
        id: pin
        run: helpers/pins.py get nife | tee -a "$GITHUB_OUTPUT"

      - name: Check out nife at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.pin.outputs.slug }}
          ref: ${{ steps.pin.outputs.commit }}
          path: ${{ matrix.nife_path }}
          persist-credentials: false

      - name: Provision the toolchain the pinned commit names
        working-directory: ${{ matrix.nife_path }}
        run: script/bootstrap
        env:
          NIFE_SKIP_LINT_TOOLS: "1"

      # A C recipe compiles with the pinned nife's C library flags, and its aarch64 ABI flag
      # (`-mabi=aapcs-soft`) is clang 19's. The runner's default clang is 18, which refuses it, so
      # the build names clang 19 through `NIFE_CC`, which nife's helpers/c-library-cc.sh reads.
      - name: Install clang 19 for the C recipes
        run: sudo apt-get update && sudo apt-get install -y clang-19

      - name: Build the packages and the repository
        run: |
          mkdir -p "$TMPDIR"
          helpers/packages.py build "${{ matrix.nife_path }}" repository
        env:
          NIFE_CC: clang-19
          TMPDIR: ${{ runner.temp }}/${{ matrix.tmp }}

      - name: Keep the repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.leg == 'primary' && 'repository' || 'repository-independent' }}
          retention-days: 14
          path: repository/

  # The gate: the independent build's every file is the primary's, byte for byte.
  reproduce:
    name: the two builds are byte-identical
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repository
          path: primary
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repository-independent
          path: independent
      - name: Compare
        run: |
          diff -r primary independent
          echo "primary and independent hold the same $(find primary -type f | wc -l) files"

  install:
    name: jig installs them (${{ matrix.row }})
    needs: [build, reproduce]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - row: swish-check-aarch64-riscv64
            runner: ubuntu-24.04-arm
          - row: swish-check-x86_64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read the pin
        id: pin
        run: helpers/pins.py get nife | tee -a "$GITHUB_OUTPUT"

      - name: Check out nife at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.pin.outputs.slug }}
          ref: ${{ steps.pin.outputs.commit }}
          path: nife
          persist-credentials: false

      - name: Cache QEMU
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/nife-qemu
          key: qemu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nife/.qemu-version') }}
      - name: Build QEMU if the cache missed
        working-directory: nife
        run: script/ci-qemu
      - name: Put it on PATH
        run: echo "$HOME/.cache/nife-qemu/bin" >> "$GITHUB_PATH"

      - name: Provision the toolchain the pinned commit names
        working-directory: nife
        run: script/bootstrap
        env:
          NIFE_SKIP_LINT_TOOLS: "1"

      # nife's own recipe for KVM on a hosted runner; the x86_64 leg takes it when it can.
      - name: Open /dev/kvm to the runner user
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Fetch the repository
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repository
          path: repository

      - name: Boot nife and install from it
        working-directory: nife
        run: NIFE_BASALT_REPOSITORY="$GITHUB_WORKSPACE/repository" script/ci-build ${{ matrix.row }}

  # Provisional name. Boots the image basalt composed from its own packages: nife milestone 909
  # item 4. Not one of the four required check names, so it does not hold a merge; adding it to the
  # ruleset's required checks is calef's act, not the lane's. It is expected red until the pin's
  # `base-packages` can pack the test image's fixtures package (README.md BUGS names that gap).
  composed:
    name: boots the image it composed (${{ matrix.row }})
    needs: [build, reproduce]
    runs-on: ${{ matrix.runner }}
    # Three composed boots (a 180-second watch cap each) and building the base packages for two
    # architectures on one leg. `install` and `build` take 60; this builds and boots more.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - row: composed-aarch64-riscv64
            runner: ubuntu-24.04-arm
            triples: aarch64-unknown-nife riscv64-unknown-nife
            arches: aarch64 riscv64
          - row: composed-x86_64
            runner: ubuntu-24.04
            triples: x86_64-unknown-nife
            arches: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read the pin
        id: pin
        run: helpers/pins.py get nife | tee -a "$GITHUB_OUTPUT"
      - name: Check out nife at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.pin.outputs.slug }}
          ref: ${{ steps.pin.outputs.commit }}
          path: nife
          persist-credentials: false
      - name: Cache QEMU
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/nife-qemu
          key: qemu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nife/.qemu-version') }}
      - name: Build QEMU if the cache missed
        working-directory: nife
        run: script/ci-qemu
      - name: Put it on PATH
        run: echo "$HOME/.cache/nife-qemu/bin" >> "$GITHUB_PATH"
      - name: Provision the toolchain the pinned commit names
        working-directory: nife
        run: script/bootstrap
        env:
          NIFE_SKIP_LINT_TOOLS: "1"

      # nife's own recipe for KVM on a hosted runner; the x86_64 leg takes it when it can.
      - name: Open /dev/kvm to the runner user
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # The base packages are built here, not taken from `build`'s artifact: the repository that
      # job lays out carries the recipes' packages and no base ones, and the composed image's
      # catalog must vouch for exactly the packages the pin's composer reads. `base` is the one
      # builder of them; it runs the pin's own `cargo xtask base-packages` and lays the packages
      # and the `<stem> sha256:<digest>` index where `--from` and `--catalog` read them. One
      # runner builds only the arches it boots.
      - name: Build the base packages at the pin into the repository
        run: helpers/packages.py base nife repository --triples ${{ matrix.triples }}

      - name: Compose and boot the image from the repository
        working-directory: nife
        run: |
          set -e
          for arch in ${{ matrix.arches }}; do
            echo "::group::compose and boot $arch"
            cargo xtask base-image "$arch" \
              --from "$GITHUB_WORKSPACE/repository/rolling/targets" \
              --catalog "$GITHUB_WORKSPACE/repository/rolling/metadata/stand-in-index" \
              --test --boot
            echo "::endgroup::"
          done

      # A boot that stops short of the prompt is diagnosed from its serial log.
      - name: Upload the boot logs
        if: failure() && hashFiles('nife/target/base-image-*.log') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: composed-image-boot-logs-${{ matrix.row }}
          path: nife/target/base-image-*.log

  publish:
    name: publish the index to Pages and the packages to a Release
    needs: [build, reproduce, install]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write  # the Release and its tag
      pages: write     # the deployment
      id-token: write  # which deploy-pages needs to prove the deployment came from this run
    environment:
      name: github-pages
      url: https://basalt.nifeos.org/rolling/metadata/stand-in-index
    env:
      GH_TOKEN: ${{ github.token }}
      DOMAIN: basalt.nifeos.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      # Before anything is created: the index must land at the name every image carries. Without a
      # custom domain a project site is served under the organization's Pages host, and once the
      # organization's own site (nifeos/nifeos.github.io) takes www.nifeos.org that would put this
      # index at www.nifeos.org/basalt, a name no image carries.
      - name: Pages must be on, from Actions, at basalt.nifeos.org
        run: |
          if ! site="$(gh api "repos/$GITHUB_REPOSITORY/pages" 2>/dev/null)"; then
            echo "::error::GitHub Pages is not enabled for $GITHUB_REPOSITORY; see the README's \"What calef must do\""
            exit 1
          fi
          echo "$site" | jq '{build_type, cname, https_enforced, html_url}'
          [ "$(echo "$site" | jq -r .build_type)" = workflow ] || { echo "::error::Pages must deploy from GitHub Actions"; exit 1; }
          [ "$(echo "$site" | jq -r .cname)" = "$DOMAIN" ] || { echo "::error::Pages' custom domain must be $DOMAIN"; exit 1; }
          [ "$(echo "$site" | jq -r .https_enforced)" = true ] || echo "::warning::HTTPS is not enforced on $DOMAIN yet"

      - name: Fetch the repository the build made and the install proved
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repository
          path: repository

      # One Release per publish, named for the channel, the commit's UTC date and the commit, so a
      # rerun of the same commit names the same Release. Provisional.
      - name: Name the Release
        id: tag
        run: |
          day="$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%d)"
          tag="rolling-$day-${GITHUB_SHA::7}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=https://github.com/$GITHUB_REPOSITORY/releases/download/$tag" >> "$GITHUB_OUTPUT"

      - name: Write the site
        run: helpers/packages.py publish repository site --release "${{ steps.tag.outputs.release }}"

      # A rerun of failed jobs reuses the build's artifact, so the bytes are the same and the
      # Release that exists is accepted. Different bytes under an existing tag are refused: an asset
      # is never replaced, since an index somewhere may already vouch for it. A source archive the
      # Release lacks is added to it.
      #
      # Each package goes up with its source archive (`<name>-<version>-source.tar.gz`, provisional),
      # what helpers/packages.py says it was built from: a GPL package's binary may only be offered
      # with its source, and every package is treated the same.
      - name: Put the packages and their sources on the Release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          shopt -s nullglob
          sources=(repository/rolling/sources/*-source.tar.gz)
          [ ${#sources[@]} -gt 0 ] || { echo "::error::the build wrote no source archives"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir existing
            gh release download "$TAG" --dir existing --pattern '*.nifepkg' --pattern '*-source.tar.gz'
            for f in repository/rolling/targets/*.nifepkg "${sources[@]}"; do
              e="existing/$(basename "$f")"
              if [ ! -e "$e" ] && [[ "$f" == *-source.tar.gz ]]; then
                gh release upload "$TAG" "$f"
                continue
              fi
              cmp -s "$f" "$e" || { echo "::error::$TAG holds a different $(basename "$f")"; exit 1; }
            done
            echo "$TAG holds these packages and their sources"
          else
            {
              echo "basalt's rolling channel, built at nife's pin by run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
              echo
              echo "The index at https://$DOMAIN/rolling/metadata/stand-in-index lists these assets and their SHA-256 digests:"
              echo
              echo '```'
              cat site/rolling/metadata/stand-in-index
              echo '```'
              echo
              echo "Each package's source, the exact files and patches it was built from, is the \`<name>-<version>-source.tar.gz\` beside it."
            } > notes.md
            gh release create "$TAG" repository/rolling/targets/*.nifepkg "${sources[@]}" \
              --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
          fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # The index's second address, basalt.crickertech.com (nife §250 clause 6; calef, 2026-10-21 UTC:
  # "P1: a second Pages site in nifeos for basalt.crickertech.com"). Pages serves one custom domain
  # per site, so it is the site of its own repository, nifeos/basalt-backup, which serves its
  # `pages` branch. This job replaces that branch with the very files `publish` deployed, plus the
  # two a branch-built site needs: CNAME (its custom domain) and .nojekyll (serve files as they are).
  # A separate job so that a failure here never holds back basalt.nifeos.org; it fails loudly
  # rather than skipping when its deploy key is missing.
  #
  # Names provisional: the job, the repository, the branch and the secret.
  backup:
    name: copy the site to the second address
    needs: publish
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: backup-site
      cancel-in-progress: false
    env:
      DOMAIN: basalt.crickertech.com
      SITE_REPOSITORY: nifeos/basalt-backup
      BRANCH: pages
    steps:
      - name: Fetch what publish deployed
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: deployed

      - name: Replace the second site's branch with it
        env:
          DEPLOY_KEY: ${{ secrets.BACKUP_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::BACKUP_DEPLOY_KEY is not set, so $DOMAIN is not updated; see the README's \"What calef must do\""
            exit 1
          fi
          mkdir site
          tar -xf deployed/artifact.tar -C site
          [ -s site/rolling/metadata/stand-in-index ] || { echo "::error::the deployed site has no index"; exit 1; }
          echo "$DOMAIN" > site/CNAME
          touch site/.nojekyll
          install -m 700 -d ~/.ssh
          (umask 077; printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/backup_site)
          # github.com's host keys, from its own API over TLS rather than trusted on first use.
          curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/backup_site -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          # One orphan commit each time, so the repository holds one copy of the packages, not
          # every publish's.
          cd site
          git init -q -b "$BRANCH"
          git add -A
          git -c user.name="basalt publish" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "basalt's site as published by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID ($GITHUB_SHA)"
          git push --force "git@github.com:$SITE_REPOSITORY.git" "$BRANCH:$BRANCH"
          echo "$SITE_REPOSITORY's $BRANCH holds $(git ls-files | wc -l) files, served at https://$DOMAIN/"